$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/auth/login"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "username": "string",
        "password": "string"
      }
