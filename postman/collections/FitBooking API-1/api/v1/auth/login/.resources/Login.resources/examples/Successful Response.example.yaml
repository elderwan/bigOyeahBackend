            "properties": {
              "user_id": {
                "type": "integer",
                "title": "User Id"
              },
              "username": {
                "type": "string",
                "title": "Username"
              },
              "display_name": {
                "type": "string",
                "title": "Display Name"
              },
              "email": {
                "type": "string",
                "title": "Email"
