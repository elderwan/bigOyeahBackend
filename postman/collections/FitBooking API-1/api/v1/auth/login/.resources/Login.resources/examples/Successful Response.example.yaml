          "updated_at": "2025-05-05T12:56:29.672Z"
        },
        "token_type": "bearer"
      }
    $type: |-
      {
        "title": "AuthResponse",
        "type": "object",
        "properties": {
          "access_token": {
            "type": "string",
            "title": "Access Token"
          },
          "token_type": {
            "type": "string",
